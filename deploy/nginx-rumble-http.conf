# rumble.robowiki.net :80 -- ACME challenge + redirect to HTTPS.
# Safe to enable BEFORE the cert exists: no ssl_certificate reference, so it
# can't break `nginx -t` for the existing wiki vhosts. Serving the webroot here
# is what lets certbot's HTTP-01 challenge succeed once DNS resolves.
server {
    listen 80;
    listen [::]:80;
    server_name rumble.robowiki.net;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
