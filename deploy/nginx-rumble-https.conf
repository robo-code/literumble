map $request_uri $rumble_limit_key {
    default                 $binary_remote_addr;
    ~^/UploadedResults      "";
}

limit_req_zone $rumble_limit_key zone=rumble:10m rate=5r/s;
limit_req_status 429;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rumble.robowiki.net;

    ssl_certificate     /etc/letsencrypt/live/rumble.robowiki.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rumble.robowiki.net/privkey.pem;
    include snippets/security-headers.conf;

    root /opt/literumble;
    access_log /var/log/nginx/rumble.access.log;
    error_log  /var/log/nginx/rumble.error.log;

    location /flags/            { alias /opt/literumble/flags/; expires 99d; access_log off; }
    location = /style.css       { root /opt/literumble; }
    location = /robots.txt      { root /opt/literumble; access_log off; }
    location = /favicon.ico     { root /opt/literumble; expires 99d; access_log off; }
    location = /googlea1fa86d6b3ddcb15.html { root /opt/literumble; }

    location / {
        limit_req zone=rumble burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # overwrite (not append) so admin stays loopback-only
        proxy_set_header X-Appengine-Cron "";
        proxy_set_header X-Appengine-TaskName "";
    }
}
